async function changeAdminPassword(){
  const np=prompt('Enter your new secret Admin Password:');
  if(!np||!np.trim())return;
  const conf=prompt('Confirm your new secret Admin Password:');
  if(np!==conf){alert('Passwords did not match. Password was not changed.');return}
  const h=await hashPwd(np.trim());
  try{localStorage.setItem('admin_pwd_hash',h)}catch(x){}
  alert('Admin password updated successfully! Please keep it safe.');
}
function showAuthModal(){
  let m=$('#authModal');
  if(!m){
    m=document.createElement('div');

    m.style.cssText='position:fixed;inset:0;background:rgba(8,18,34,.75);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;';

      <div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px'>
        <div style='display:flex;align-items:center;gap:10px'><span style='font-size:22px'>🔒</span><div><b style='font-size:17px;display:block'>Admin Sign-In</b><small style='color:var(--mute);font-size:12px'>Authorized access only</small></div></div>
        <button id='authClose' class='x2' style='font-size:24px;line-height:1'>&times;</button>
      </div>
      <p style='color:var(--mute);font-size:13.5px;line-height:1.5;margin:0 0 16px'>Restricted portal. Only <strong>${ADMIN_EMAIL}</strong> with the correct admin password can open this editor.</p>
      <label style='font-size:12px;color:var(--mute);font-weight:600;display:block'>Admin Email</label>
      <input id='authEmailInput' type='email' value='${ADMIN_EMAIL}' style='width:100%;padding:10px 12px;margin:5px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px'>
      <label style='font-size:12px;color:var(--mute);font-weight:600;display:block'>Admin Password</label>
      <div style='position:relative;margin:5px 0 12px'>
        <input id='authPwdInput' type='password' placeholder='Enter admin password' style='width:100%;padding:10px 40px 10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px' autofocus>
        <button type='button' id='authShowPwd' style='position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;color:var(--mute)' title='Show/Hide password'>👁️</button>
      </div>
      <div id='authErrMsg' style='display:none;color:#DC2626;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.25);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:12px'></div>
      <div style='display:flex;justify-content:flex-end;gap:10px;margin-top:6px'>
        <button class='btn o' id='authCancelBtn'>Cancel</button>
        <button class='btn' id='authSubmitBtn'>Verify & Open Admin</button>
      </div>
    </div>`;
    document.body.appendChild(m);
    const close=()=>{m.style.display='none';$('#authErrMsg').style.display='none'};
    $('#authClose').onclick=close;
    $('#authCancelBtn').onclick=close;
    m.onclick=e=>{if(e.target===m)close()};
    $('#authShowPwd').onclick=()=>{const p=$('#authPwdInput');p.type=p.type==='password'?'text':'password'};
    const submit=async()=>{
      const email=($('#authEmailInput').value||'').trim().toLowerCase();
      const pwd=($('#authPwdInput').value||'').trim();
      const err=$('#authErrMsg');
      if(email!==ADMIN_EMAIL){
        err.style.display='block';
        err.textContent=`Access denied: "${email||'(blank)'}" is not authorized. Only ${ADMIN_EMAIL} can access admin.`;
        $('#authEmailInput').focus();
        return;
      }
      if(!pwd){
        err.style.display='block';
        err.textContent='Please enter the admin password.';
        $('#authPwdInput').focus();
        return;
      }
      const enteredHash=await hashPwd(pwd);
      const targetHash=localStorage.getItem('admin_pwd_hash')||DEF_HASH;
      if(enteredHash===targetHash){
        owner=true;
        try{localStorage.setItem('admin_email',ADMIN_EMAIL);sessionStorage.setItem('adm','1')}catch(x){}
        close();
        view();
        adm();
        $('#admin').classList.add('on');
      }else{
        err.style.display='block';
        err.textContent='Access denied: Incorrect admin password.';
        $('#authPwdInput').focus();
      }
    };
    $('#authSubmitBtn').onclick=submit;
    $('#authPwdInput').onkeydown=e=>{if(e.key==='Enter')submit()};
    $('#authEmailInput').onkeydown=e=>{if(e.key==='Enter')$('#authPwdInput').focus()};
  }
  m.style.display='flex';
  $('#authErrMsg').style.display='none';
  const pwd=$('#authPwdInput');
  if(pwd){pwd.value='';setTimeout(()=>pwd.focus(),60)}
}

async function go(q){q=q.trim();if(!q||busy)return;busy=true;add(q,'u');const r=add('Thinking...','a');
try{
  const API_URL="https://new-portfolio-zuil.onrender.com";
  const res=await fetch(`${API_URL}/api/chat`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:q,question:q,data:D})
  });
  const d=await res.json().catch(()=>({}));
  if(res.ok&&(d.answer||d.message)){r.textContent=d.answer||d.message;m.scrollTop=m.scrollHeight;busy=false;return;}
  if(d.error)throw new Error(d.error);
  throw new Error('Server returned '+res.status);

      }

}busy=false}
