<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Rishika Mishra | SDE-I (AI)</title>
  <meta name="description"
    content="Portfolio of Rishika Mishra, SDE-I (AI) at Wattmonk Technologies. Python, backend APIs, workflow automation and Generative AI (Gemini, Vertex AI).">
  <meta property="og:title" content="Rishika Mishra | SDE-I (AI) Portfolio">
  <meta property="og:description"
    content="Backend, API development, workflow automation and AI integration with Python, Gemini and Vertex AI.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#4CC9B0">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --bg: #F6F8FB;
      --card: #fff;
      --ink: #0B1F3A;
      --mute: #5B6B80;
      --acc: #0D9488;
      --acc2: #0B1F3A;
      --line: #E2E8F0;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0A1424;
        --card: #111E33;
        --ink: #E8EEF7;
        --mute: #9AA9BD;
        --acc: #2DD4BF;
        --acc2: #2DD4BF;
        --line: #1E2E47
      }
    }

    :root[data-theme="dark"] {
      --bg: #0A1424;
      --card: #111E33;
      --ink: #E8EEF7;
      --mute: #9AA9BD;
      --acc: #2DD4BF;
      --acc2: #2DD4BF;
      --line: #1E2E47
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif
    }

    a {
      color: var(--acc);
      text-decoration: none
    }

    .w {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px
    }

    nav {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      z-index: 5
    }

    nav .w {
      display: flex;
      gap: 18px;
      align-items: center;
      height: 54px;
      overflow-x: auto
    }

    nav b {
      margin-right: auto;
      white-space: nowrap
    }

    nav a {
      color: var(--mute);
      font-size: 14px;
      white-space: nowrap
    }

    .hero {
      padding: 72px 0 48px
    }

    .hero small {
      color: var(--acc);
      font-weight: 600;
      letter-spacing: .08em
    }

    .hero h1 {
      font-size: clamp(34px, 7vw, 58px);
      line-height: 1.1;
      margin: 8px 0 12px
    }

    .hero p {
      color: var(--mute);
      max-width: 680px
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--acc);
      color: #fff;
      font-weight: 600;
      border: 0;
      cursor: pointer;
      font-size: 14px;
      margin: 6px 8px 0 0
    }

    .btn.o {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line)
    }

    section {
      padding: 40px 0
    }

    h2 {
      font-size: 24px;
      margin: 0 0 20px
    }

    h2:after {
      content: "";
      display: block;
      width: 40px;
      height: 3px;
      background: var(--acc);
      margin-top: 6px;
      border-radius: 2px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px
    }

    .card h3 {
      margin: 0;
      font-size: 17px
    }

    .meta {
      color: var(--mute);
      font-size: 13.5px
    }

    .card ul {
      margin: 10px 0 0;
      padding-left: 18px;
      color: var(--mute)
    }

    .g {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px
    }

    .g .card {
      margin: 0
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--acc) 14%, transparent);
      color: var(--acc);
      margin: 4px 6px 0 0
    }

    footer {
      padding: 30px 0;
      color: var(--mute);
      font-size: 13px;
      text-align: center
    }

    #admin {
      position: fixed;
      inset: 0;
      background: var(--bg);
      overflow: auto;
      z-index: 20;
      display: none;
      padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px)
    }

    #admin.on {
      display: block
    }

    #admin input,
    #admin textarea {
      width: 100%;
      padding: 8px 10px;
      margin: 3px 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-size: 14px
    }

    #admin label {
      font-size: 12px;
      color: var(--mute)
    }

    .bar {
      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 12px 0;
      display: flex;
      gap: 8px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      z-index: 2
    }

    .bar span {
      margin-right: auto;
      font-weight: 700
    }

    .x {
      color: #DC2626;
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 13px
    }

    #msg {
      font-size: 13px;
      color: var(--mute)
    }

    .hero {
      position: relative;
      overflow: hidden
    }

    .hero:before,
    .hero:after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .35;
      animation: fl 12s ease-in-out infinite alternate
    }

    .hero:before {
      width: 340px;
      height: 340px;
      background: var(--acc);
      top: -80px;
      left: -80px
    }

    .hero:after {
      width: 300px;
      height: 300px;
      background: #6366F1;
      right: -60px;
      bottom: -60px;
      animation-delay: -5s
    }

    .hg {
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      gap: 30px;
      align-items: center;
      position: relative;
      z-index: 1
    }

    @media(max-width:800px) {
      .hg {
        grid-template-columns: 1fr
      }
    }

    .hero h1 {
      background: linear-gradient(90deg, var(--ink), var(--acc), #6366F1, var(--ink));
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sh 6s linear infinite
    }

    .mon {
      position: relative;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      padding: 14px 0 10px;
      animation: bob 6s ease-in-out infinite, fi 1s both
    }

    .scr {
      background: var(--card);
      border: 3px solid var(--acc);
      border-radius: 16px;
      box-shadow: 0 20px 50px color-mix(in srgb, var(--acc) 30%, transparent);
      overflow: hidden
    }

    .bar2 {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line)
    }

    .bar2 i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #F87171
    }

    .bar2 i:nth-child(2) {
      background: #FBBF24
    }

    .bar2 i:nth-child(3) {
      background: #34D399
    }

    #code {
      margin: 0;
      padding: 16px;
      min-height: 150px;
      font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace;
      color: var(--ink);
      white-space: pre-wrap;
      overflow: hidden
    }

    .k {
      color: #6366F1;
      font-weight: 600
    }

    .s {
      color: var(--acc)
    }

    .cur {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--acc);
      vertical-align: -2px;
      animation: bl 1s steps(1) infinite
    }

    .stand {
      width: 90px;
      height: 22px;
      margin: 0 auto;
      background: var(--acc);
      border-radius: 0 0 12px 12px
    }

    .kb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px
    }

    .cup {
      width: 30px;
      height: 32px;
      border: 2px solid var(--acc);
      border-radius: 4px 4px 10px 10px
    }

    .keys {
      flex: 1;
      height: 36px;
      border: 2px solid var(--acc);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px
    }

    .keys i {
      width: 22px;
      height: 16px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--acc) 22%, transparent);
      animation: ky 1.8s infinite
    }

    .keys i:nth-child(2) {
      animation-delay: .4s
    }

    .keys i:nth-child(3) {
      animation-delay: .8s
    }

    .keys i:nth-child(4) {
      animation-delay: 1.2s
    }

    .ms {
      width: 24px;
      height: 42px;
      border: 2px solid var(--acc);
      border-radius: 12px
    }

    .fl {
      position: absolute;
      font: 700 30px ui-monospace, monospace;
      color: var(--acc);
      opacity: .6;
      animation: bob 5s ease-in-out infinite
    }

    .f1 {
      left: -8px;
      top: 30px
    }

    .f2 {
      right: -6px;
      top: 55%;
      animation-delay: 1s
    }

    .f3 {
      left: 10px;
      bottom: 90px;
      animation-delay: 2s
    }

    .f4 {
      right: 30px;
      top: -12px;
      animation-delay: .5s;
      color: #6366F1
    }

    @keyframes bob {
      50% {
        transform: translateY(-10px)
      }
    }

    @keyframes bl {
      50% {
        opacity: 0
      }
    }

    @keyframes ky {

      0%,
      100% {
        background: color-mix(in srgb, var(--acc) 22%, transparent)
      }

      50% {
        background: var(--acc)
      }
    }

    @keyframes fl {
      to {
        transform: translate(50px, 40px) scale(1.2)
      }
    }

    @keyframes sh {
      to {
        background-position: 200% center
      }
    }

    @keyframes fi {
      from {
        opacity: 0
      }
    }

    .rv {
      opacity: 0;
      transform: translateY(26px);
      transition: opacity .7s ease, transform .7s ease
    }

    .rv.in {
      opacity: 1;
      transform: none
    }

    .card.in {
      transition: transform .25s, box-shadow .25s
    }

    .card.in:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px color-mix(in srgb, var(--acc) 18%, transparent)
    }

    .g .card {
      position: relative;
      overflow: hidden
    }

    .g .card:before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(200px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--acc) 16%, transparent), transparent);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none
    }

    .g .card:hover:before {
      opacity: 1
    }

    .tag {
      transition: transform .2s
    }

    .tag:hover {
      transform: scale(1.1)
    }

    .btn {
      transition: transform .2s, box-shadow .2s
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px color-mix(in srgb, var(--acc) 35%, transparent)
    }

    nav a:hover {
      color: var(--acc)
    }

    #pg {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0;
      background: linear-gradient(90deg, var(--acc), #6366F1);
      z-index: 30
    }

    #ai {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 15
    }

    #aib {
      background: linear-gradient(135deg, var(--acc), #6366F1);
      color: #fff;
      border: 0;
      border-radius: 99px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(13, 148, 136, .4);
      animation: pu 2.5s infinite
    }

    @keyframes pu {
      50% {
        transform: scale(1.06)
      }
    }

    #aip {
      display: none;
      position: absolute;
      right: 0;
      bottom: 56px;
      width: min(440px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
      overflow: hidden;
    }

    #aip.on {
      display: block;
    }

    .ah {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: var(--acc2);
      color: #fff;
    }

    .ah button {
      background: none;
      border: 0;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      line-height: 1;
    }

    #am {
      height: 380px;
      max-height: 60vh;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .b {
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 90%;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .b.a {
      background: var(--bg);
      align-self: flex-start;
      border: 1px solid var(--line);
    }

    .b.u {
      background: var(--acc);
      color: #0B1F3A;
      font-weight: 500;
      align-self: flex-end;
    }

    .ch {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 12px 8px
    }

    .ch button {
      font-size: 12px;
      border: 1px solid var(--line);
      background: none;
      color: var(--ink);
      border-radius: 99px;
      padding: 4px 10px;
      cursor: pointer
    }

    .af {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid var(--line)
    }

    .af input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font: inherit;
      font-size: 14px
    }

    .af button {
      background: var(--acc);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      cursor: pointer
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }

      .rv {
        opacity: 1;
        transform: none
      }
    }

    :root {
      --acc: #4CC9B0
    }

    :root[data-theme='dark'] {
      --acc: #5EEAD4
    }

    .btn {
      color: #0B1F3A
    }

    .b.u,
    .af button {
      color: #0B1F3A
    }

    #aib {
      background: linear-gradient(135deg, #4CC9B0, #8B8DF5);
      color: #0B1F3A
    }

    .tag {
      color: color-mix(in srgb, var(--acc) 55%, var(--ink))
    }

    .hero small,
    h2:after {
      color: var(--acc)
    }

    .hero:before {
      width: 460px;
      height: 460px;
      filter: none;
      opacity: .8;
      background: radial-gradient(circle, color-mix(in srgb, var(--acc) 28%, transparent), transparent 68%);
      top: -140px;
      left: -160px
    }

    .hero:after {
      width: 420px;
      height: 420px;
      filter: none;
      opacity: .6;
      background: radial-gradient(circle, rgba(139, 141, 245, .28), transparent 68%);
      top: 10%;
      right: -180px;
      bottom: auto
    }

    .hero h1 {
      background: none;
      -webkit-text-fill-color: var(--ink);
      color: var(--ink);
      animation: none
    }

    .f1 {
      left: -34px;
      top: 40px
    }

    .f2 {
      right: -30px;
      top: 50%
    }

    .f3 {
      left: -22px;
      bottom: 100px
    }

    .scr {
      box-shadow: 0 18px 40px color-mix(in srgb, var(--acc) 22%, transparent)
    }

    .st {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 22px
    }

    .st .card {
      text-align: center;
      margin: 0;
      color: var(--mute);
      font-size: 14px
    }

    .st b {
      display: block;
      font-size: 32px;
      color: color-mix(in srgb, var(--acc) 70%, var(--ink))
    }

    @media(max-width:600px) {
      .st {
        grid-template-columns: repeat(2, 1fr)
      }
    }

    .flow {
      display: flex;
      align-items: center;
      margin-top: 16px
    }

    .nd {
      padding: 10px 16px;
      border: 2px solid var(--acc);
      border-radius: 12px;
      font: 600 13px ui-monospace, Menlo, monospace;
      background: var(--card);
      white-space: nowrap
    }

    .nd.hi {
      background: var(--acc);
      color: #0B1F3A;
      animation: pu 2.5s infinite
    }

    .ln {
      flex: 1;
      height: 2px;
      background: var(--line);
      position: relative;
      min-width: 28px
    }

    .ln i {
      position: absolute;
      top: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--acc);
      animation: tr 2s linear infinite
    }

    .ln.b i {
      animation-delay: 1s
    }

    @keyframes tr {
      from {
        left: 0;
        opacity: 0
      }

      20% {
        opacity: 1
      }

      to {
        left: calc(100% - 10px);
        opacity: 0
      }
    }

    @keyframes trv {
      from {
        top: 0;
        opacity: 0
      }

      20% {
        opacity: 1
      }

      to {
        top: calc(100% - 10px);
        opacity: 0
      }
    }

    @media(max-width:600px) {
      .flow {
        flex-direction: column;
        align-items: stretch;
        text-align: center
      }

      .ln {
        flex: none;
        width: 2px;
        height: 30px;
        margin: 0 auto
      }

      .ln i {
        left: -4px;
        top: 0;
        animation-name: trv
      }
    }

    .tl {
      position: relative;
      padding-left: 28px
    }

    .tl:before {
      content: '';
      position: absolute;
      left: 7px;
      top: 8px;
      bottom: 8px;
      width: 2px;
      background: linear-gradient(var(--acc), transparent);
      transform-origin: top;
      animation: dr 1.8s ease-out both
    }

    .tli {
      position: relative
    }

    .tli:before {
      content: '';
      position: absolute;
      left: -28px;
      top: 22px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--acc);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--acc) 25%, transparent);
      animation: pu2 2.2s infinite
    }

    @keyframes dr {
      from {
        transform: scaleY(0)
      }
    }

    @keyframes pu2 {
      50% {
        box-shadow: 0 0 0 9px transparent
      }
    }

    .dots {
      display: flex;
      gap: 5px;
      margin-bottom: 12px
    }

    .dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #F87171
    }

    .dots i:nth-child(2) {
      background: #FBBF24
    }

    .dots i:nth-child(3) {
      background: #34D399
    }

    .g .card:hover .dots i {
      animation: jp .6s ease infinite alternate
    }

    .dots i:nth-child(2) {
      animation-delay: .1s !important
    }

    .dots i:nth-child(3) {
      animation-delay: .2s !important
    }

    @keyframes jp {
      to {
        transform: translateY(-4px)
      }
    }

    .mq {
      overflow: hidden;
      margin-bottom: 12px;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)
    }

    .mt {
      display: flex;
      width: max-content;
      gap: 10px;
      animation: mq 30s linear infinite
    }

    .mq.r .mt {
      animation-direction: reverse
    }

    .mt .tag {
      font-size: 14px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      margin: 0;
      white-space: nowrap
    }

    .mq:hover .mt {
      animation-play-state: paused
    }

    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    .ring {
      animation: ring 2s infinite
    }

    @keyframes ring {
      0% {
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--acc) 55%, transparent)
      }

      100% {
        box-shadow: 0 0 0 16px transparent
      }
    }

    .pi {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      display: block;
      transition: transform .4s
    }

    .card:hover .pi {
      transform: scale(1.04)
    }

    .cert .pi {
      height: 130px
    }

    .sub {
      margin: 30px 0 14px;
      font-size: 18px
    }

    .pv {
      max-width: 160px;
      max-height: 100px;
      border-radius: 8px;
      display: block;
      margin: 4px 0 8px
    }

    #admin input[type=file] {
      padding: 6px
    }

    .car {
      position: relative
    }

    .row.g {
      display: flex;
      grid-template-columns: none;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 2px 14px;
      scrollbar-width: thin
    }

    .row .card {
      flex: 0 0 min(320px, 82%);
      scroll-snap-align: start;
      margin: 0
    }

    .ar {
      position: absolute;
      top: 42%;
      z-index: 3;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .12);
      transition: transform .2s, background .2s
    }

    .ar:hover {
      background: var(--acc);
      transform: scale(1.1)
    }

    .ar.l {
      left: -14px
    }

    .ar.r {
      right: -14px
    }

    @media(max-width:700px) {
      .ar {
        width: 36px;
        height: 36px
      }

      .ar.l {
        left: -6px
      }

      .ar.r {
        right: -6px
      }
    }

    #net {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    .badge {
      display: flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid var(--line);
      background: var(--card);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px
    }

    .badge i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22C55E;
      animation: ping 1.8s infinite
    }

    @keyframes ping {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, .6)
      }

      100% {
        box-shadow: 0 0 0 10px transparent
      }
    }

    .fc {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 16px
    }

    .fc .card {
      margin: 0
    }

    .ic {
      display: inline-grid;
      place-items: center;
      min-width: 44px;
      height: 44px;
      padding: 0 8px;
      border-radius: 12px;
      background: color-mix(in srgb, var(--acc) 22%, transparent);
      font: 700 15px ui-monospace, monospace;
      margin-bottom: 10px;
      transition: transform .3s
    }

    .fc .card:hover .ic {
      transform: rotate(-8deg) scale(1.12)
    }

    .snap {
      margin-top: 16px
    }

    .snap h3 {
      margin-bottom: 12px
    }

    .snap dl {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin: 0
    }

    .snap dt {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--mute)
    }

    .snap dd {
      margin: 2px 0 0;
      font-weight: 600
    }

    .cta {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 14px
    }

    #cg {
      position: fixed;
      left: 0;
      top: 0;
      width: 360px;
      height: 360px;
      margin: -180px 0 0 -180px;
      border-radius: 50%;
      background: radial-gradient(circle, color-mix(in srgb, var(--acc) 16%, transparent), transparent 65%);
      pointer-events: none;
      z-index: -1;
      will-change: transform
    }

    #tp {
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s, transform .2s;
      z-index: 14
    }

    #tp.on {
      opacity: 1;
      pointer-events: auto
    }

    #tp:hover {
      transform: translateY(-3px)
    }

    section .w,
    .hero .hg,
    .card {
      position: relative
    }

    .pen {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid var(--acc);
      background: var(--card);
      color: var(--ink);
      font-weight: 600;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      z-index: 4;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
      transition: transform .2s, background .2s
    }

    .pen:hover {
      background: var(--acc);
      color: #0B1F3A;
      transform: translateY(-2px)
    }

    .pen.top {
      top: 2px
    }

    .hero .pen.top {
      top: -52px
    }

    .pen.inl {
      position: static;
      margin-left: 12px;
      vertical-align: middle
    }

    #ed {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 18, 34, .55);
      backdrop-filter: blur(3px);
      z-index: 40;
      align-items: center;
      justify-content: center;
      padding: 16px
    }

    #ed.on {
      display: flex
    }

    .em {
      background: var(--card);
      color: var(--ink);
      border-radius: 16px;
      width: min(560px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 30px 70px rgba(0, 0, 0, .35);
      animation: fi .25s
    }

    .eh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      font-size: 17px
    }

    .x2 {
      background: none;
      border: 0;
      font-size: 26px;
      line-height: 1;
      color: var(--mute);
      cursor: pointer
    }

    .eb {
      padding: 16px 20px;
      overflow: auto
    }

    .ef {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--line)
    }

    .ef .btn {
      margin: 0
    }

      font-size: 14px

    #ed label {
      font-size: 12px;

    #ed input[type=file] {
      padding: 6px
    }

      font-size: 14px;
      white-space: nowrap

    #pb.on {
      transform: translate(-50%, 0)

    #pb .btn {
      margin: 0
    }

    .pen {
      width: 30px;
      height: 30px;
      padding: 0;
      display: inline-grid;

      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);

      top: 12px;
      right: 12px;
      font-size: 16px;
      line-height: 1
    }

    .pen:hover {
      background: var(--acc);
      color: #0B1F3A;
      border-color: var(--acc);
      transform: scale(1.1)
    }

    .pen.inl {

      margin-left: 10px;
      vertical-align: middle;
      width: 28px;
      height: 28px
    }

    .pen.add {
      font-weight: 700;
      font-size: 18px
    }

    .card>.pen {
      position: absolute;
      opacity: 0
    }

    .card:hover>.pen,

      opacity: 1
    }

    @media(hover:none) {
      .card>.pen {
        opacity: 1
      }
    }

    .card:has(>.pen) h3 {
      padding-right: 36px
    }

      position: sticky;
      top: 0;
      background: var(--bg);
      padding: 14px 0;
      display: flex;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      z-index: 3
    }

    .ab2 .btn {
      margin: 0
    }

    .ab2 span {
      margin-right: auto;
      margin-left: 6px;
      font-size: 13px;
      color: var(--mute)
    }

    .as {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden
    }

    .ah2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: color-mix(in srgb, var(--acc) 12%, transparent)
    }

    .ar2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid var(--line)
    }

    .ar2>div {
      min-width: 0
    }

    .ar2 b,
    .ar2 small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .ar2 small {
      color: var(--mute);
      font-size: 13px
    }

    .ib {
      width: 34px;
      height: 34px;
      flex: none;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 18px;
      transition: background .2s, transform .2s
    }

    .ib:hover {
      background: var(--acc);
      color: #0B1F3A;
      transform: scale(1.08)
    }

    #th {
      background: none;
      border: 1px solid var(--line);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      flex: none;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: transform .4s
    }

    #th:hover {
      transform: rotate(25deg) scale(1.1)
    }

    body,
    .card,
    nav,
    .nd,
    .badge {
      transition: background-color .35s, color .35s, border-color .35s
    }

      if (GRP[k]) { t = GRP[k][0]; h = GRP[k][1].map(n => inp(topF.find(x => x[0] === n), D[n], '')).join('') } else { const L = lists[k], it = D[k][i]; t = 'Edit ' + L[0]; h = L[1].map(f => inp(f, it[f[0]], `data-k='${k}' data-i='${i}'`)).join('') }

    }
    function closeEd() { curEd = null; const o = $('#ed'); if (o) { o.className = ''; o.innerHTML = '' } }
    document.addEventListener('click', ev => {
      const t = ev.target.closest && ev.target.closest('[data-ex]'); if (!t || !curEd) return; const a = t.dataset.ex, k = curEd[0], i = curEd[1];
      if (a === 'cancel') { const s = JSON.parse(snap); Object.keys(D).forEach(x => delete D[x]); Object.assign(D, s); dirty = snapDirty; closeEd(); refresh() }
      else if (a === 'done') { closeEd(); refresh() }
      else if (a === 'del') { if (t.dataset.sure) { D[k].splice(i, 1); dirty = true; closeEd(); refresh() } else { t.dataset.sure = '1'; t.textContent = 'Click again to confirm delete'; t.style.fontWeight = '700'; setTimeout(() => { if (t.isConnected) { delete t.dataset.sure; t.textContent = 'Delete this item'; t.style.fontWeight = '' } }, 4000) } }
    });
    function curTh() { return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') }
    try { const s = localStorage.getItem('th'); if (s) document.documentElement.dataset.theme = s } catch (x) { }
    const IC = `<svg viewBox='0 0 24 24' width='16' height='16' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20h9'/><path d='M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z'/></svg>`;
    function refresh() { view(); if ($('#admin').classList.contains('on')) adm() }
    function addItem(k) { snap = JSON.stringify(D); snapDirty = dirty; curEd = [k, -1]; D[k].push(JSON.parse(JSON.stringify(lists[k][2]))); dirty = true; ed(k, D[k].length - 1) }
    function adm() {
      if (!isAuthorizedAdmin()) { $('#admin').classList.remove('on'); showAuthModal(); return }
      if (curEd) return ed(curEd[0], curEd[1]);
      const cut = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n) + '...' : s };
      const row = (k, i, a, b) => `<div class='ar2'><div><b>${e(a) || '(untitled)'}</b><small>${e(b)}</small></div><button class='ib' data-aed='${k}:${i}' title='Edit'>${IC}</button></div>`;
      const sec = (t, k, rows) => `<div class='as'><div class='ah2'><b>${t}</b>${k ? `<button class='ib add' data-aadd='${k}' title='Add new'>+</button>` : ''}</div>${rows}</div>`;
      const lst = (k, f) => D[k].map((x, i) => row(k, i, ...f(x))).join('');
      $('#admin').innerHTML = `<div class='w'><div class='ab2'><button class='btn o' data-aback>← Back to site</button><span id='msg'>${dirty ? 'You have unpublished changes' : 'All changes are published'}</span><button class='btn o' data-achpwd style='font-size:12.5px'>Change Password</button><button class='btn o' data-alogout style='color:#DC2626;border-color:rgba(220,38,38,.3)'>Logout</button><button class='btn' data-apub>Publish changes</button></div><h2 style='margin-top:24px'>Edit your portfolio</h2><p style='color:var(--mute);margin:0 0 18px'>Click the pencil next to anything to edit it, then press Publish changes.</p>`
        + sec('Profile', null, row('hero', '', 'Intro', D.name + ' · ' + (D.status || '')) + row('about', '', 'About text', cut(D.summary, 70)) + row('skills', '', 'Skills', D.skills.length + ' skills') + row('contact', '', 'Contact links', D.email))
        + sec('What I do', 'focus', lst('focus', x => [x.t, cut(x.d, 60)]))
        + sec('Experience', 'experience', lst('experience', x => [x.role, x.company + ' · ' + x.period]))
        + sec('Projects', 'projects', lst('projects', x => [x.title, (x.tags || []).join(', ')]))
        + sec('Education', 'education', lst('education', x => [x.degree, x.school]))
        + sec('Certifications', 'certs', lst('certs', x => [x.title, x.link || '']))
        + `<div style='height:60px'></div></div>`
    }
    document.addEventListener('click', ev => {
      const t = ev.target.closest && ev.target.closest('[data-aed],[data-aadd],[data-aback],[data-apub],[data-alogout],[data-achpwd]'); if (!t || curEd) return; const d = t.dataset;
      if (d.aed !== undefined) { const [k, i] = d.aed.split(':'); ed(k, i === '' ? undefined : +i) }
      else if (d.aadd) addItem(d.aadd);
      else if (d.achpwd !== undefined) changeAdminPassword();
      else if (d.aback !== undefined) { try { sessionStorage.removeItem('adm') } catch (x) { } $('#admin').classList.remove('on'); view() }
      else if (d.alogout !== undefined) { if (dirty && !confirm('Log out of admin mode? Any unpublished changes will be discarded.')) return; try { localStorage.removeItem('admin_email'); sessionStorage.removeItem('adm') } catch (x) { } owner = false; $('#admin').classList.remove('on'); view() }
      else if (d.apub !== undefined) save()
    });
    function pensOld() {
      if (!owner) return; const mk = (host, label, fn, cls) => { if (!host) return; const b = document.createElement('button'); b.className = 'pen ' + (cls || ''); b.textContent = label; b.onclick = ev => { ev.stopPropagation(); fn() }; host.appendChild(b) }; const ep = '✏️ Edit';
      mk($('.hero .hg'), ep + ' intro', () => ed('hero'), 'top'); mk($('#about .w'), ep, () => ed('about'), 'top'); mk($('#skills .w'), ep + ' skills', () => ed('skills'), 'top'); mk($('#contact .w'), ep + ' links', () => ed('contact'), 'top');
      [['#exp .tl>.card', 'experience'], ['#proj .row>.card', 'projects'], ['#edu .tl>.card', 'education'], ['#skills .cert', 'certs']].forEach(([s, k]) => document.querySelectorAll(s).forEach((c, i) => mk(c, ep, () => ed(k, i))));
      const add = k => { snap = JSON.stringify(D); snapDirty = dirty; curEd = [k, -1]; D[k].push(JSON.parse(JSON.stringify(lists[k][2]))); dirty = true; ed(k, D[k].length - 1) };
      mk($('#exp .w'), '+ Add experience', () => add('experience'), 'top'); mk($('#proj .w'), '+ Add project', () => add('projects'), 'top'); mk($('#edu .w'), '+ Add education', () => add('education'), 'top'); mk($('.sub'), '+ Add certification', () => add('certs'), 'inl')
    }
    function pens() {
      if (!owner) return;
      const ic = `<svg viewBox='0 0 24 24' width='15' height='15' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 20h9'/><path d='M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z'/></svg>`;
      const mk = (host, html, tip, fn, cls) => { if (!host) return; const b = document.createElement('button'); b.className = 'pen ' + (cls || ''); b.innerHTML = html; b.title = tip; b.setAttribute('aria-label', tip); b.onclick = ev => { ev.stopPropagation(); fn() }; host.appendChild(b) };
      const h2 = id => document.querySelector('#' + id + ' h2');
      const add = k => { snap = JSON.stringify(D); snapDirty = dirty; curEd = [k, -1]; D[k].push(JSON.parse(JSON.stringify(lists[k][2]))); dirty = true; ed(k, D[k].length - 1) };
      mk($('.hero small'), ic, 'Edit intro', () => ed('hero'), 'inl'); mk(h2('about'), ic, 'Edit About text', () => ed('about'), 'inl'); mk(h2('about'), '+', 'Add a focus card', () => add('focus'), 'inl add'); mk(h2('skills'), ic, 'Edit skills', () => ed('skills'), 'inl'); mk(h2('contact'), ic, 'Edit contact links', () => ed('contact'), 'inl');
      [['#exp .tl>.card', 'experience'], ['#proj .row>.card', 'projects'], ['#edu .tl>.card', 'education'], ['#skills .cert', 'certs'], ['#about .fc>.card', 'focus']].forEach(([s, k]) => document.querySelectorAll(s).forEach((c, i) => mk(c, ic, 'Edit', () => ed(k, i))));
      [['exp', 'experience', 'Add experience'], ['proj', 'projects', 'Add project'], ['edu', 'education', 'Add education']].forEach(([id, k, t]) => mk(h2(id), '+', t, () => add(k), 'inl add'));
      mk($('.sub'), '+', 'Add certification', () => add('certs'), 'inl add')
    }
    function pb() { let b = $('#pb'); if (!owner) { if (b) b.remove(); return } if (!b) { b = document.createElement('div'); b.id = 'pb'; document.body.appendChild(b) } b.className = dirty ? 'on' : ''; b.innerHTML = `<span id='pbm'>You have unpublished changes</span><button class='btn' id='pbp'>Publish changes</button>`; $('#pbp').onclick = save }
    let raf; function net() { cancelAnimationFrame(raf); const cv = $('#net'); if (!cv || matchMedia('(prefers-reduced-motion:reduce)').matches) return; const g = cv.getContext('2d'), h = cv.parentElement; let W, H, P = [], m = { x: -999, y: -999 }; const rs = () => { W = cv.width = h.clientWidth; H = cv.height = h.clientHeight; P = Array.from({ length: Math.min(60, Math.round(W * H / 16000)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4 })) }; rs(); window.onresize = rs; h.onmousemove = ev => { const r = cv.getBoundingClientRect(); m.x = ev.clientX - r.left; m.y = ev.clientY - r.top }; h.onmouseleave = () => { m.x = m.y = -999 }; const col = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim() || '#4CC9B0'; const f = () => { g.clearRect(0, 0, W, H); P.forEach((p, i) => { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; g.fillStyle = col; g.globalAlpha = .5; g.beginPath(); g.arc(p.x, p.y, 2, 0, 6.3); g.fill(); for (let j = i + 1; j < P.length; j++) { const q = P[j], d = Math.hypot(p.x - q.x, p.y - q.y); if (d < 120) { g.globalAlpha = (1 - d / 120) * .25; g.strokeStyle = col; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke() } } const dm = Math.hypot(p.x - m.x, p.y - m.y); if (dm < 160) { g.globalAlpha = (1 - dm / 160) * .5; g.strokeStyle = col; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(m.x, m.y); g.stroke() } }); raf = requestAnimationFrame(f) }; f() }
    function aiInit() {
      const d = document.createElement('div'); d.id = 'ai';
      d.innerHTML = `<button id='aib'>✨ Ask AI</button><div id='aip'><div class='ah'><b>Ask about Rishika</b><button id='aix'>×</button></div><div id='am'><div class='b a'>Hi! I am an AI assistant. Ask me about Rishika's experience, projects or skills.</div></div><div class='ch'>${['30-second summary', 'Why hire her?', 'Tech stack', 'Best project', 'How to contact her'].map(t => '<button>' + t + '</button>').join('')}</div><div class='af'><input id='aq' placeholder='Ask anything...'><button id='as'>Send</button></div></div>`;
      document.body.appendChild(d);       const m = $('#am'); let busy = false;
      const add = (t, c) => { const x = document.createElement('div'); x.className = 'b ' + c; x.textContent = t; m.appendChild(x); m.scrollTop = m.scrollHeight; return x };
      async function go(q) {
      q = q.trim(); if (!q || busy) return; busy = true; add(q, 'u'); const r = add('Thinking...', 'a');
      try {
        const apiUrl = location.hostname === 'localhost' || location.hostname === '127.0.0.1'
          ? ''
          : 'https://new-portfolio-zuil.onrender.com';
        const res = await fetch(`${apiUrl}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: q, question: q, data: D })
        });
        const d = await res.json().catch(() => ({}));
        if (res.ok && (d.answer || d.message)) {
          r.textContent = d.answer || d.message;
          m.scrollTop = m.scrollHeight;
          busy = false;
          return;
        }
        if (d.error) throw new Error(d.error);
        throw new Error('Server returned ' + res.status);
      } catch (e) {
        if (typeof claude !== 'undefined' && claude.use) {
          try {
            const s = await claude.use('sample');
            if (s) {
              await s('You are the assistant on the portfolio website of Rishika Mishra. Answer visitors in 2-4 short sentences, in third person, using ONLY this profile data: ' + JSON.stringify(D, (k, v) => k === 'img' ? undefined : v) + '\nIf the answer is not in the data, say so and suggest emailing her. Visitor question: ' + q, { onText: o => { r.textContent = o.text; m.scrollTop = m.scrollHeight } });
              busy = false;
              return;
            }
          } catch (x) { }
        }
        r.textContent = 'The AI assistant is unavailable right now (it may be waking up, please try again in a moment). You can email Rishika at ' + D.email + '.';
      }
      busy = false;
    }
    $('#aib').onclick = () => $('#aip').classList.toggle('on'); $('#aix').onclick = () => $('#aip').classList.remove('on');
    $('#as').onclick = () => { const i = $('#aq'); go(i.value); i.value = '' }; $('#aq').onkeydown = ev => { if (ev.key === 'Enter') $('#as').click() };
    d.querySelectorAll('.ch button').forEach(b => b.onclick = () => go(b.textContent))
    }
    async function save() {
      const m = $('#msg') || $('#pbm') || {}; if (!isAuthorizedAdmin()) { m.textContent = 'Only ' + ADMIN_EMAIL + ' can publish.'; return }
      m.textContent = 'Publishing…'; const c = document.documentElement.cloneNode(true); c.querySelector('#app').innerHTML = ''; c.querySelector('#admin').innerHTML = ''; c.querySelector('#admin').className = ''; c.removeAttribute('data-theme'); c.querySelectorAll('#ai,#pg,#cg,#tp,#ed,#pb,#authModal').forEach(n => n.remove());
      c.querySelector('#data').textContent = JSON.stringify(D).replace(/</g, '\\u003c');
      dirty = false;
      try { localStorage.setItem('portfolio_data', JSON.stringify(D)) } catch (x) { }
      if (art) {
        try { await art.publish('<!DOCTYPE html>' + c.outerHTML); m.textContent = 'Published successfully!' } catch (x) { m.textContent = 'Could not save: ' + (x.code || x.message || 'error') }
      } else {
        try {
          const blob = new Blob(['<!DOCTYPE html>' + c.outerHTML], { type: 'text/html' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html'; a.click(); URL.revokeObjectURL(a.href);
          m.textContent = 'Saved! Downloaded updated index.html & updated local storage.';
        } catch (x) { m.textContent = 'Saved to local browser storage!' }
      }
    }
    view();
    (async () => {
      try {
        if (typeof claude !== 'undefined' && claude.use) {
          const u = await claude.use('user');
          if (u && u.isOwner()) {
            const me = await u.me();
            const em = (me && me.email || '').toLowerCase().trim();
            if (em === ADMIN_EMAIL) {
              owner = true;
              localStorage.setItem('admin_email', ADMIN_EMAIL);
              art = await claude.use('artifact');
            } else {
              owner = false;
              localStorage.removeItem('admin_email');
            }
          }
        }
      } catch (x) { }
      if (isAuthorizedAdmin()) {
        owner = true;
        view();
        pens();
        pb();
        try { if (sessionStorage.getItem('adm')) { adm(); $('#admin').classList.add('on') } } catch (x) { }
      }
    })();
    window.addEventListener('hashchange', () => { if (location.hash === '#admin') openAdmin() });
    if (location.hash === '#admin') setTimeout(openAdmin, 120);
  </script>
